<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Scheduler | Curator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="scheduler.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
</head>

<body>
    <header class="app-header">
        <a href="/" class="back-link">← Dashboard</a>
        <div class="header-title">
            <h1>Blog Scheduler</h1>
            <span class="badge" id="queue-count">0 items</span>
        </div>
        <div class="header-actions">
            <button id="toggle-compact" class="btn-secondary">
                <span class="icon">↕️</span> Minimize All
            </button>
            <button id="save-order-btn" class="primary-btn" disabled>Saved</button>
        </div>
    </header>

    <main class="scheduler-container">
        <div class="schedule-timeline">
            <!-- Date markers could go here -->
        </div>

        <div id="scheduler-list" class="scheduler-list">
            <div class="loading">Loading queue...</div>
        </div>
    </main>

    <script src="scheduler.js?v=3"></script>
</body>

</html>
